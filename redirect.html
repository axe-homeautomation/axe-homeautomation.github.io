<!DOCTYPE HTML> 
<html>
  <head> 
    <meta charset="utf-8"> 
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="author" content="Parashuram">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> 
    <meta name="MSSmartTagsPreventParsing" content="true"> 
    <meta name="viewport" content="width=device-width,initial-scale=1"> 
    <link rel="apple-touch-icon" href="https://nparashuram.com/favicon.ico"> 
    <link rel="image/vnd.microsoft.icon" rel="icon" href="https://nparashuram.com/favicon.ico"> 
    <meta name="theme-color" content="#fff"> 
    <link rel="icon" sizes="369x369" href="http://nparashuram.com/me.png"> 
    <title>Redirecting ... </title>
  </head>
  <body style="text-align:center">
    <div id="redirect">
    <h1 id="timer">Redirecting in 5 ... </h1>
    <h2><span id="destination"></span></h2>
    <hr />
  </div>
  <div>
    <button id="set_redirect">Set Redirect URL</button>
    <button id="cancel_timer">Cancel Redirect</button>
  </div>
  <div id="code-section" style="display:none; margin-top: 2em;">
    <h2>Authorization Code</h2>
    <div style="display:flex; justify-content:center; align-items:center; gap: 0.5em; flex-wrap: wrap;">
      <input id="code-box" type="text" readonly
        style="font-family: monospace; font-size: 1em; padding: 0.6em; width: min(90vw, 480px); box-sizing: border-box;" />
      <button id="copy-code">Copy</button>
    </div>
  </div>
  <script type="text/javascript">
    var redirect = window.localStorage['redirect_page'];
    var code = new URLSearchParams(window.location.search).get('code');
    var time = 5;
    var timerEl = document.getElementById("timer");
    var timer = null;
    if (typeof redirect === "undefined") {
      document.getElementById("redirect").style.display = "none";
    } else {
      document.getElementById("destination").innerText = redirect + window.location.search
      if (!code) {
        // Only auto-redirect when there's no code on screen for the user to copy.
        var timer = window.setInterval(function() {
          timerEl.innerText = "Redirecting in " + time--;
          if (time < 0) {
            window.clearInterval(timer);
            window.location.href = redirect + window.location.search;
          }
        }, 1000)
      } else {
        timerEl.innerText = "Redirect paused (code available below)";
      }
    }
    document.getElementById("cancel_timer").addEventListener("click", function() {
      timerEl.innerText = "Redirect cancelled";
      window.clearInterval(timer);
    });
    document.getElementById("set_redirect").addEventListener("click", function() {
      redirect = window.prompt("Redirect URL", redirect)
      if (redirect) {
        window.localStorage['redirect_page'] = redirect
        window.location.reload()
      }
    });

    if (code) {
      var codeSection = document.getElementById("code-section");
      var codeBox = document.getElementById("code-box");
      var copyButton = document.getElementById("copy-code");
      codeBox.value = code;
      codeSection.style.display = "block";

      codeBox.addEventListener("click", function() {
        codeBox.select();
        codeBox.setSelectionRange(0, 99999);
      });

      copyButton.addEventListener("click", function() {
        codeBox.select();
        codeBox.setSelectionRange(0, 99999);
        var showCopied = function() {
          var original = copyButton.innerText;
          copyButton.innerText = "Copied!";
          window.setTimeout(function() { copyButton.innerText = original; }, 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(showCopied, function() {
            document.execCommand("copy");
            showCopied();
          });
        } else {
          document.execCommand("copy");
          showCopied();
        }
      });
    }
  </script>
  </body>
</html>
